<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="subTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .node-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
    }

    /* Ambient pulse animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.15) translate(-10px, 10px); opacity: 0.45; }
    }
    @keyframes floatNode {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -100; }
    }
    @keyframes ripple {
      0% { r: 8px; opacity: 1; }
      100% { r: 24px; opacity: 0; }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
    .animated-dash { stroke-dasharray: 8 6; animation: dashCycle 6s linear infinite; }
    .ripple-circle { animation: ripple 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    .floating-group-1 { animation: floatNode 5s ease-in-out infinite; }
    .floating-group-2 { animation: floatNode 6s ease-in-out infinite 1s; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambient Orbs (Background layer) -->
  <g opacity="0.35">
    <circle class="orb-1" cx="200" cy="120" r="160" fill="#0284c7" filter="url(#glow)" />
    <circle class="orb-2" cx="1020" cy="280" r="180" fill="#7c3aed" filter="url(#glow)" />
    <circle cx="600" cy="380" r="130" fill="#0d9488" filter="url(#glow)" opacity="0.2" />
  </g>

  <!-- High-Tech Coordinate Grid Background -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1150" y1="0" x2="1150" y2="420" />
    
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- World Geolocation Coordinate Arc Nodes (Background decorative flow) -->
  <g stroke="url(#lineGrad)" stroke-width="1.8" fill="none">
    <path class="animated-dash" d="M 120 310 Q 320 220 520 290 T 920 260 T 1120 320" />
    <path class="animated-dash" d="M 80 180 Q 380 90 680 160 T 1140 140" opacity="0.5" />
  </g>

  <!-- Geolocation Ping Radar Visuals -->
  <g transform="translate(140, 290)" class="floating-group-1">
    <circle class="ripple-circle" cx="0" cy="0" r="10" stroke="#38bdf8" stroke-width="1.5" fill="none" />
    <circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#subtleGlow)" />
    <rect x="-28" y="-32" width="56" height="20" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
    <text x="0" y="-18" text-anchor="middle" fill="#38bdf8" class="node-text">US-EAST</text>
  </g>

  <g transform="translate(1060, 240)" class="floating-group-2">
    <circle class="ripple-circle" cx="0" cy="0" r="10" stroke="#c084fc" stroke-width="1.5" fill="none" style="animation-delay: 1.2s;" />
    <circle cx="0" cy="0" r="5" fill="#c084fc" filter="url(#subtleGlow)" />
    <rect x="-28" y="-32" width="56" height="20" rx="10" fill="#0f172a" stroke="#9333ea" stroke-width="1" />
    <text x="0" y="-18" text-anchor="middle" fill="#c084fc" class="node-text">EU-WEST</text>
  </g>

  <!-- Foreground Title and Core Branding -->
  <g id="foreground-content">
    <!-- Category Mini-Tag -->
    <g transform="translate(600, 75)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="-115" cy="0" r="4" fill="#38bdf8" filter="url(#subtleGlow)" />
      <text x="5" y="5" text-anchor="middle" fill="#7dd3fc" class="badge-text">GLOBAL PROXY &amp; GEOLOCATION</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="150" text-anchor="middle" fill="url(#primaryTextGrad)" class="title-text" filter="url(#subtleGlow)">
      Global Geolocation &amp; Proxy Testing
    </text>

    <!-- Subtitle / Mission -->
    <text x="600" y="200" text-anchor="middle" fill="url(#subTextGrad)" class="subtitle-text">
      The Curated Directory of Residential Proxy Networks, IP Rotators &amp; Self-Hosted Pools
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(600, 270)">
      <!-- Pill 1: Residential Proxies -->
      <g transform="translate(-320, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
        <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" class="badge-text">🌐 Residential Networks</text>
      </g>
      
      <!-- Pill 2: IP Rotation -->
      <g transform="translate(-105, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
        <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" class="badge-text">🔄 Smart IP Rotation</text>
      </g>

      <!-- Pill 3: Self-Hosted Pools -->
      <g transform="translate(105, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />
        <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" class="badge-text">⚡ Self-Hosted Pools</text>
      </g>

      <!-- Pill 4: Open Source -->
      <g transform="translate(315, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.6" />
        <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" class="badge-text">🔓 100% Open Source</text>
      </g>
    </g>

    <!-- Bottom Metrics & Value Bar -->
    <g transform="translate(600, 360)">
      <line x1="-380" y1="-20" x2="380" y2="-20" stroke="url(#lineGrad)" stroke-width="1" />
      <text x="0" y="10" text-anchor="middle" fill="#64748b" class="badge-text" font-size="12px">
        ENTERPRISE SAAS PRICING • FREE TIERS &amp; TRIALS • OPEN-SOURCE TOOLS • REVENUE DATA
      </text>
    </g>
  </g>
</svg>
