00;font-size:11px}.orb-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 100px}.orb-2{animation:pulseOrb 10s ease-in-out infinite reverse;transform-origin:1000px 300px}.animated-dash{stroke-dasharray:8 6;animation:dashCycle 6s linear infinite}.ripple-circle{animation:ripple 2.5s cubic-bezier(0,.2,.8,1) infinite}.floating-group-1{animation:floatNode 5s ease-in-out infinite}.floating-group-2{animation:floatNode 6s ease-in-out infinite 1s}</style><rect width="1200" height="420" fill="url(#bgGrad)"/><g opacity=".35"><circle cx="200" cy="120" r="160" fill="#0284c7" class="orb-1" filter="url(#glow)"/><circle cx="1020" cy="280" r="180" fill="#7c3aed" class="orb-2" filter="url(#glow)"/><circle cx="600" cy="380" r="130" fill="#0d9488" filter="url(#glow)" opacity=".2"/></g><g stroke="#334155" stroke-opacity=".18" stroke-width="1"><line x1="100" x2="100" y1="0" y2="420"/><line x1="250" x2="250" y1="0" y2="420"/><line x1="400" x2="400" y1="0" y2="420"/><line x1="550" x2="550" y1="0" y2="420"/><line x1="700" x2="700" y1="0" y2="420"/><line x1="850" x2="850" y1="0" y2="420"/><line x1="1000" x2="1000" y1="0" y2="420"/><line x1="1150" x2="1150" y1="0" y2="420"/><line x1="0" x2="1200" y1="70" y2="70"/><line x1="0" x2="1200" y1="140" y2="140"/><line x1="0" x2="1200" y1="210" y2="210"/><line x1="0" x2="1200" y1="280" y2="280"/><line x1="0" x2="1200" y1="350" y2="350"/></g><g fill="none" stroke="url(#lineGrad)" stroke-width="1.8"><path d="M 120 310 Q 320 220 520 290 T 920 260 T 1120 320" class="animated-dash"/><path d="M 80 180 Q 380 90 680 160 T 1140 140" class="animated-dash" opacity=".5"/></g><g class="floating-group-1" transform="translate(140, 290)"><circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" class="ripple-circle"/><circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#subtleGlow)"/><rect width="56" height="20" x="-28" y="-32" fill="#0f172a" stroke="#0284c7" stroke-width="1" rx="10"/><text x="0" y="-18" fill="#38bdf8" class="node